[project]
name = "trainheroic-mcp"
version = "0.1.1"
description = "Unofficial MCP server for TrainHeroic: read your training history and plan personal workouts with sets, reps, weights and exercise videos."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ilya Bazylchuk" }]
requires-python = ">=3.12"
keywords = ["mcp", "trainheroic", "strength-training", "claude"]
dependencies = [
    "httpx>=0.27",
    "mcp>=2.3,<3",
]

[project.scripts]
trainheroic-mcp = "trainheroic_mcp.server:main"

[project.urls]
Repository = "https://github.com/IBazylchuk/trainheroic-mcp"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-httpx>=0.35",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
